name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run

      - name: Build extension zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="tripwire-${VERSION}.zip"
          zip -r "$ZIP_NAME" \
            manifest.json \
            background.js \
            browser-api.js \
            browser-polyfill.js \
            content-script.js \
            format-utils.js \
            glb-decompress.js \
            meshopt_decoder.js \
            popup.html \
            popup.css \
            popup.js \
            url-utils.js \
            icons/
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
